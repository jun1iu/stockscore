name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npx eslint
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx next build
