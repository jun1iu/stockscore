name: Data health

# Runs after the weekday refresh (07:17 UTC). If the live data is stale or the last refresh failed,
# /api/health answers 503, this job fails, and GitHub emails the repository owner.
on:
  schedule:
    - cron: '43 9 * * 1-5'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /api/health
        run: |
          status=$(curl -s -o health.json -w '%{http_code}' https://stockscore-ten.vercel.app/api/health)
          cat health.json; echo
          if [ "$status" != "200" ]; then
            echo "::error title=StockScore data is unhealthy::$(cat health.json)"
            exit 1
          fi
